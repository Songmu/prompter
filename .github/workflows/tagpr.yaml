name: tagpr

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: tagpr
  cancel-in-progress: false

jobs:
  tagpr:
    permissions:
      contents: write
      pull-requests: write
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: setup go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: stable
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: tagpr
      uses: Songmu/tagpr@v1.21.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
